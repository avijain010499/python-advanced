version: 2

sources:
  - name: raw
    description: "Raw data loaded by dbt seed into the raw_ingestion schema"
    # database: omitted — defaults to the connected database (my_etl_db on PostgreSQL)
    schema: main_raw_ingestion      # Schema where seeds land (raw_ingestion prefix from dbt_project.yml)

    tables:
      - name: raw_orders
        description: "Raw orders from the transactional database"
        loaded_at_field: updated_at          # Column used for freshness check
        freshness:
          warn_after:  { count: 6,  period: hour }   # Alert if data > 6h old
          error_after: { count: 24, period: hour }   # Error if data > 24h old
        columns:
          - name: order_id
            description: "Primary key — unique identifier per order"
            tests:
              - not_null
              - unique
          - name: customer_id
            description: "Foreign key to raw_customers"
            tests:
              - not_null

      - name: raw_customers
        description: "Raw customer profile records"
        columns:
          - name: customer_id
            description: "Primary key"
            tests:
              - not_null
              - unique

      - name: raw_products
        description: "Product catalog"
        columns:
          - name: product_id
            description: "Primary key"
            tests:
              - not_null
              - unique
